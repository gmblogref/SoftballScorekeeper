name: Pull Request Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore unit-test dependencies
        run: dotnet restore SoftballScorekeeper.Tests/SoftballScorekeeper.Tests.csproj

      - name: Run unit tests
        run: dotnet test SoftballScorekeeper.Tests/SoftballScorekeeper.Tests.csproj --configuration Release --no-restore
